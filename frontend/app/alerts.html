<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>报警情况 · 反无人机检测与预警系统</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 业务界面 3：报警情况 -->
  <div id="topbar"></div>
  <main class="view">
    <div class="toolbar">
      <h1 class="page-title">报警情况</h1>
      <span class="spacer"></span>
      <select id="alertFilter" class="sel">
        <option value="">全部状态</option>
        <option value="unconfirmed">未确认</option>
        <option value="confirmed">已确认</option>
      </select>
      <button class="btn sm" id="refreshAlerts">刷新</button>
    </div>
    <div id="alertsBox"><div class="card"><div class="empty">加载中…</div></div></div>
  </main>

  <div id="toast" class="toast"></div>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="pages/alerts.js"></script>
</body>
</html>
