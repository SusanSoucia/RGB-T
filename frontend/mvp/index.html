<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>反无人机检测 · MVP 控制台</title>
<style>
  :root { --bd:#d5d8dd; --fg:#1f2328; --mut:#6b7280; --pri:#2563eb; --bg:#f6f7f9; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
         color:var(--fg); background:var(--bg); font-size:14px; }
  header { background:#fff; border-bottom:1px solid var(--bd); padding:10px 18px;
           display:flex; align-items:center; gap:14px; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .spacer { flex:1; }
  main { display:grid; grid-template-columns: 360px 1fr; gap:14px; padding:14px; align-items:start; }
  .card { background:#fff; border:1px solid var(--bd); border-radius:8px; padding:12px; margin-bottom:12px; }
  .card h2 { font-size:13px; margin:0 0 10px; font-weight:600; color:var(--mut);
             text-transform:uppercase; letter-spacing:.04em; }
  label { display:block; font-size:12px; color:var(--mut); margin:8px 0 4px; }
  input[type=text], input[type=password], input[type=file], select {
    width:100%; padding:7px 9px; border:1px solid var(--bd); border-radius:6px; font-size:13px;
    background:#fff; }
  button { padding:7px 12px; border:1px solid var(--bd); background:#fff; border-radius:6px;
           cursor:pointer; font-size:13px; }
  button.primary { background:var(--pri); color:#fff; border-color:var(--pri); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .stage-wrap { background:#fff; border:1px solid var(--bd); border-radius:8px; padding:10px; }
  canvas#stage { width:100%; display:block; background:#eef1f4; border-radius:6px; cursor:crosshair; }
  .hint { color:var(--mut); font-size:12px; margin-top:8px; line-height:1.6; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { text-align:left; padding:5px 6px; border-bottom:1px solid #eef0f3; }
  th { color:var(--mut); font-weight:600; }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; }
  .tag.ok { background:#e7f6ec; color:#1a7f37; }
  .tag.warn { background:#fff4e5; color:#9a6700; }
  .tag.err { background:#fdecec; color:#b42318; }
  .muted { color:var(--mut); }
  code { background:#f2f4f7; padding:1px 5px; border-radius:4px; font-size:12px; }
  #log { font-family:ui-monospace,Consolas,monospace; font-size:11px; color:#374151;
         max-height:110px; overflow:auto; white-space:pre-wrap; }
  .kv { display:grid; grid-template-columns:88px 1fr; gap:4px 8px; font-size:12px; }
  .kv div:nth-child(odd) { color:var(--mut); }
  .frames { max-height:190px; overflow:auto; }
  .frames tr { cursor:pointer; }
  .frames tr:hover { background:#f7f9fc; }
  .frames tr.sel { background:#e8f0fe; }
</style>
</head>
<body>

<header>
  <h1>反无人机检测与预警 · MVP</h1>
  <span class="muted" id="who">未登录</span>
  <div class="spacer"></div>
  <button id="btnLogout" style="display:none">退出</button>
</header>

<main>
  <!-- ================= 左栏 ================= -->
  <div>
    <div class="card" id="cardLogin">
      <h2>登录</h2>
      <label>用户名</label>
      <input type="text" id="username" value="admin" />
      <label>密码</label>
      <input type="password" id="password" value="Admin@12345" />
      <div class="row" style="margin-top:10px">
        <button class="primary" id="btnLogin">登录</button>
      </div>
      <div class="hint">默认管理员 admin / Admin@12345（见 backend/app/scripts/seed_admin.py）</div>
    </div>

    <div class="card" style="display:none" id="cardUpload">
      <h2>1. 上传素材</h2>
      <label>可见光图片 / 视频</label>
      <input type="file" id="fileRgb" accept="image/*,video/*" />
      <label>红外文件（可选，成对上传才能用 T / 融合模式）</label>
      <input type="file" id="fileIr" accept="image/*,video/*" />
      <div class="row" style="margin-top:10px">
        <button class="primary" id="btnUpload">上传</button>
        <button id="btnRefresh">刷新列表</button>
      </div>
      <label style="margin-top:12px">我的素材</label>
      <select id="mediaList"></select>
      <div class="hint" id="mediaInfo"></div>
    </div>

    <div class="card" style="display:none" id="cardDetect">
      <h2>2. 检测</h2>
      <label>模式</label>
      <select id="mode">
        <option value="auto">auto（自适应选模态）</option>
        <option value="rgb">rgb（仅可见光）</option>
        <option value="ir">ir（仅热红外）</option>
        <option value="fusion">fusion（双模态结果级融合）</option>
      </select>
      <div class="row" style="margin-top:10px">
        <button class="primary" id="btnDetect">开始检测</button>
      </div>
      <div class="kv" id="taskInfo" style="margin-top:10px"></div>
    </div>

    <div class="card" style="display:none" id="cardAlerts">
      <h2>3. 告警</h2>
      <div class="row" style="margin-bottom:8px">
        <button id="btnAlerts">刷新告警</button>
      </div>
      <div id="alertsBox" class="muted">暂无</div>
    </div>
  </div>

  <!-- ================= 右栏 ================= -->
  <div>
    <div class="stage-wrap">
      <canvas id="stage" width="960" height="540"></canvas>
      <div class="hint" id="stageHint">
        登录并上传素材后，这里显示画面。在画面上**按住拖拽**即可画警戒区域（红色虚线框）。
      </div>
    </div>

    <div class="card" style="margin-top:12px; display:none" id="cardFrames">
      <h2>帧级结果（点击某一行查看该帧）</h2>
      <div class="frames">
        <table>
          <thead>
            <tr><th>帧号</th><th>时间(ms)</th><th>目标</th><th>侵入</th><th>最高分</th></tr>
          </thead>
          <tbody id="framesBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>区域</h2>
      <div class="row">
        <button id="btnSaveRegion" disabled>保存当前画的区域</button>
        <button id="btnClearRegion">清除画面上的区域</button>
      </div>
      <div id="regionsBox" class="muted" style="margin-top:8px">尚未创建</div>
    </div>

    <div class="card">
      <h2>日志</h2>
      <div id="log"></div>
    </div>
  </div>
</main>

<script>
// ---------------------------------------------------------------- 状态
const S = {
  token: localStorage.getItem('token') || '',
  user: null,
  media: null,          // 当前选中的 media 对象
  task: null,           // 最近一次任务
  frames: [],
  frameIndex: null,
  regions: [],
  img: null,            // 当前显示的 Image
  boxes: [],            // 当前显示的框 [{x1,y1,x2,y2,score}]
  drag: null,           // 正在拖拽的矩形 {x1,y1,x2,y2} 归一化
};

const $ = (id) => document.getElementById(id);
const canvas = $('stage');
const ctx = canvas.getContext('2d');

function log(msg) {
  const el = $('log');
  const t = new Date().toLocaleTimeString();
  el.textContent = `[${t}] ${msg}\n` + el.textContent;
}
function setWho() {
  $('who').textContent = S.user ? `${S.user.display_name || S.user.username}（${S.user.role}）` : '未登录';
  $('cardLogin').style.display = S.user ? 'none' : '';
  ['cardUpload','cardDetect','cardAlerts'].forEach(id => {
    $(id).style.display = S.user ? '' : 'none';
  });
  $('btnLogout').style.display = S.user ? '' : 'none';
}

// ---------------------------------------------------------------- HTTP
async function api(path, opts = {}) {
  const headers = opts.headers || {};
  if (S.token) headers['Authorization'] = 'Bearer ' + S.token;
  if (opts.body && !(opts.body instanceof FormData)) {
    headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  const res = await fetch('/api' + path, { ...opts, headers });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = { raw: text }; }
  if (!res.ok) {
    const err = new Error((data && (data.message || data.detail)) || res.statusText);
    err.code = data && data.code;
    err.status = res.status;
    throw err;
  }
  return data;
}

// ---------------------------------------------------------------- 登录
$('btnLogin').onclick = async () => {
  try {
    const data = await api('/auth/login', {
      method: 'POST',
      body: { username: $('username').value.trim(), password: $('password').value },
    });
    S.token = data.access_token;
    S.user = data.user;
    localStorage.setItem('token', S.token);
    setWho();
    log('登录成功：' + data.user.username);
    await refreshMediaList();
    await refreshAlerts();
  } catch (e) { log('登录失败：' + e.message); }
};

$('btnLogout').onclick = async () => {
  try { await api('/auth/logout', { method: 'POST' }); } catch {}
  S.token = ''; S.user = null; localStorage.removeItem('token'); setWho();
  log('已退出');
};

// ---------------------------------------------------------------- 上传 / 素材
$('btnUpload').onclick = async () => {
  const f = $('fileRgb').files[0];
  if (!f) { log('请先选择可见光文件'); return; }
  const fd = new FormData();
  fd.append('file', f);
  const ir = $('fileIr').files[0];
  if (ir) fd.append('ir_file', ir);
  try {
    log('上传中…（大文件会慢）');
    const media = await api('/media', { method: 'POST', body: fd });
    log(`上传成功 #${media.id} ${media.media_type} ${media.width}×${media.height} has_ir=${media.has_ir}`);
    await refreshMediaList(media.id);
  } catch (e) { log('上传失败：' + e.message); }
};

$('btnRefresh').onclick = () => refreshMediaList(S.media && S.media.id);

async function refreshMediaList(selectId) {
  const page = await api('/media?page=1&page_size=50');
  const sel = $('mediaList');
  sel.innerHTML = '';
  if (!page.items.length) {
    sel.innerHTML = '<option value="">（还没有素材）</option>';
  }
  for (const m of page.items) {
    const o = document.createElement('option');
    o.value = m.id;
    o.textContent = `#${m.id} ${m.original_name}（${m.media_type}${m.has_ir ? ' +T' : ''}）`;
    sel.appendChild(o);
  }
  const target = selectId || (page.items[0] && page.items[0].id);
  if (target) { sel.value = target; await selectMedia(Number(target)); }
}

$('mediaList').onchange = () => selectMedia(Number($('mediaList').value));

async function selectMedia(id) {
  if (!id) return;
  S.media = await api('/media/' + id);
  S.task = null; S.frames = []; S.frameIndex = null; S.boxes = []; S.drag = null;
  $('framesBody').innerHTML = '';
  $('cardFrames').style.display = 'none';
  $('taskInfo').innerHTML = '';
  $('mediaInfo').textContent =
    `${S.media.media_type} · ${S.media.width || '?'}×${S.media.height || '?'}` +
    `${S.media.has_ir ? ` · 红外 ${S.media.ir_width}×${S.media.ir_height}` : ' · 无红外'}`
    + (S.media.total_frames ? ` · ${S.media.total_frames} 帧 / stride ${S.media.frame_stride}` : '');
  await refreshRegions();
  await loadPreview();
}

async function loadPreview() {
  // 图片直接取原始画面；视频要等检测跑完才有帧图
  if (!S.media) return;
  if (S.media.media_type === 'image') {
    await loadImage(`/api/media/${S.media.id}/image`);
  } else if (S.frames.length) {
    await showFrame(S.frames[0].frame_index);
  } else {
    clearStage('这是视频：先点「开始检测」，跑完后再用结果帧画区域。');
  }
}

function clearStage(msg) {
  S.img = null; S.boxes = [];
  canvas.width = 960; canvas.height = 540;
  ctx.fillStyle = '#eef1f4'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#9aa3ad'; ctx.font = '15px sans-serif';
  ctx.fillText(msg || '', 24, 40);
  $('stageHint').textContent = msg || '';
}

function loadImage(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      S.img = img;
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      render();
      resolve();
    };
    img.onerror = () => { clearStage('图片加载失败'); resolve(); };
    img.src = src + (src.includes('?') ? '&' : '?') + 't=' + Date.now();
  });
}

// ---------------------------------------------------------------- 绘制
function render() {
  if (!S.img) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(S.img, 0, 0, canvas.width, canvas.height);
  const W = canvas.width, H = canvas.height;

  // 已保存的区域（黄色实线）
  ctx.lineWidth = Math.max(2, W / 400);
  ctx.setLineDash([]);
  ctx.strokeStyle = '#f59e0b';
  for (const r of S.regions) drawPoly(r.points, W, H);

  // 正在拖拽的矩形（红色虚线）
  if (S.drag) {
    const { x1, y1, x2, y2 } = S.drag;
    ctx.setLineDash([8, 6]);
    ctx.strokeStyle = '#ef4444';
    ctx.strokeRect(x1 * W, y1 * H, (x2 - x1) * W, (y2 - y1) * H);
    ctx.setLineDash([]);
  }

  // 检测框（绿=普通，红=中心落在区域内）
  ctx.font = `${Math.max(12, W / 60)}px ui-monospace,monospace`;
  for (const b of S.boxes) {
    const inside = S.regions.some(r => pointInPoly((b.x1 + b.x2) / 2, (b.y1 + b.y2) / 2, r.points));
    ctx.strokeStyle = inside ? '#dc2626' : '#16a34a';
    ctx.lineWidth = Math.max(2, W / 400);
    ctx.strokeRect(b.x1 * W, b.y1 * H, (b.x2 - b.x1) * W, (b.y2 - b.y1) * H);
    const label = (b.score != null ? b.score.toFixed(2) : '') + (inside ? ' 侵入' : '');
    ctx.fillStyle = inside ? '#dc2626' : '#16a34a';
    ctx.fillText(label, b.x1 * W + 2, Math.max(12, b.y1 * H - 4));
  }
}

function drawPoly(points, W, H) {
  if (!points || points.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(points[0][0] * W, points[0][1] * H);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0] * W, points[i][1] * H);
  ctx.closePath();
  ctx.stroke();
}

function pointInPoly(x, y, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if ((yi > y) !== (yj > y) && (xj - xi) * (y - yi) / (yj - yi) + xi > x) inside = !inside;
  }
  return inside;
}

// ---------------------------------------------------------------- 画区域
function norm(ev) {
  const r = canvas.getBoundingClientRect();
  const x = (ev.clientX - r.left) / r.width;
  const y = (ev.clientY - r.top) / r.height;
  return { x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y)) };
}

canvas.addEventListener('mousedown', (ev) => {
  if (!S.img) return;
  const p = norm(ev);
  S.drag = { x1: p.x, y1: p.y, x2: p.x, y2: p.y };
  $('btnSaveRegion').disabled = false;
  render();
});
canvas.addEventListener('mousemove', (ev) => {
  if (!S.drag) return;
  const p = norm(ev);
  S.drag.x2 = p.x; S.drag.y2 = p.y;
  render();
});
window.addEventListener('mouseup', () => { if (S.drag) render(); });

$('btnSaveRegion').onclick = async () => {
  if (!S.drag || !S.media) return;
  let { x1, y1, x2, y2 } = S.drag;
  if (Math.abs(x2 - x1) < 0.02 || Math.abs(y2 - y1) < 0.02) { log('区域太小，重画一个'); return; }
  const pts = [[x1, y1], [x2, y1], [x2, y2], [x1, y2]].map(p => [+p[0].toFixed(5), +p[1].toFixed(5)]);
  try {
    const r = await api('/regions', {
      method: 'POST',
      body: { media_id: S.media.id, name: '区域' + (S.regions.length + 1),
              shape_type: 'rect', points: pts },
    });
    log(`区域已保存 #${r.id}`);
    S.drag = null;
    await refreshRegions();
  } catch (e) { log('保存区域失败：' + e.message); }
};

$('btnClearRegion').onclick = () => { S.drag = null; if (S.img) render(); };

async function refreshRegions() {
  if (!S.media) return;
  S.regions = await api('/regions?media_id=' + S.media.id);
  const box = $('regionsBox');
  if (!S.regions.length) box.innerHTML = '<span class="muted">尚未创建</span>';
  else box.innerHTML = S.regions.map(r =>
      `#${r.id} ${r.name}（${r.shape_type}，${r.points.length} 点）`)
    .join('<br>') + '<div class="muted" style="margin-top:6px">注意：区域只在检测时生效，改完要重新检测。</div>';
  if (S.img) render();
}

// ---------------------------------------------------------------- 检测
$('btnDetect').onclick = async () => {
  if (!S.media) return;
  $('btnDetect').disabled = true;
  try {
    log('检测中…（同步执行，帧数受 max_process_frames 限制）');
    const t = await api('/detect-tasks', {
      method: 'POST',
      body: { media_id: S.media.id, requested_mode: $('mode').value },
    });
    S.task = t;
    $('taskInfo').innerHTML = `
      <div>状态</div><div>${tag(t.status)}</div>
      <div>请求模式</div><div><code>${t.requested_mode}</code></div>
      <div>实际模式</div><div><code>${t.actual_mode || '-'}</code></div>
      <div>选择原因</div><div>${t.decision_reason || '-'}</div>
      <div>处理帧数</div><div>${t.frames_processed}</div>
      <div>端到端</div><div>${t.elapsed_ms != null ? t.elapsed_ms + ' ms' : '-'}</div>
      <div>推理累计</div><div>${t.inference_ms_total != null ? t.inference_ms_total + ' ms' : '-'}</div>`;
    log(`任务 #${t.id} ${t.status} actual=${t.actual_mode}`);
    await loadFrames();
    await refreshAlerts();
  } catch (e) {
    log('检测失败：' + e.message + (e.code ? ` (${e.code})` : ''));
  } finally { $('btnDetect').disabled = false; }
};

function tag(s) {
  const map = { succeeded: 'ok', running: 'warn', pending: 'warn', failed: 'err', timeout: 'err' };
  return `<span class="tag ${map[s] || 'warn'}">${s}</span>`;
}

async function loadFrames() {
  if (!S.task) return;
  S.frames = await api(`/detect-tasks/${S.task.id}/frames`);
  const body = $('framesBody');
  body.innerHTML = '';
  if (!S.frames.length) {
    body.innerHTML = '<tr><td colspan="5" class="muted">没有帧记录</td></tr>';
  }
  for (const f of S.frames) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${f.frame_index}</td><td>${f.frame_ts_ms ?? '-'}</td>
      <td>${f.target_count}</td><td>${f.intrusion_count ? '<b style="color:#dc2626">' + f.intrusion_count + '</b>' : 0}</td>
      <td>${f.max_score != null ? f.max_score.toFixed(3) : '-'}</td>`;
    tr.onclick = () => showFrame(f.frame_index);
    body.appendChild(tr);
  }
  $('cardFrames').style.display = '';
  if (S.frames.length) await showFrame(S.frames[0].frame_index);
}

async function showFrame(frameIndex) {
  if (!S.task || !S.media) return;
  S.frameIndex = frameIndex;
  S.boxes = await api(`/detect-tasks/${S.task.id}/detections?frame_index=${frameIndex}`);
  [...$('framesBody').children].forEach(tr => {
    tr.classList.toggle('sel', tr.firstChild && tr.firstChild.textContent === String(frameIndex));
  });
  await loadImage(`/api/media/${S.media.id}/frames/${frameIndex}`);
  $('stageHint').textContent =
    `当前帧 ${frameIndex} · 检出 ${S.boxes.length} 个目标 · 绿色=区域外，红色=区域内`;
}

// ---------------------------------------------------------------- 告警
$('btnAlerts').onclick = refreshAlerts;

async function refreshAlerts() {
  try {
    const page = await api('/alerts?page=1&page_size=20');
    const box = $('alertsBox');
    if (!page.items.length) { box.innerHTML = '<span class="muted">暂无告警</span>'; return; }
    const rows = page.items.map(a => `
      <tr>
        <td>#${a.id}</td>
        <td>${a.frame_index}</td>
        <td>${a.score_max.toFixed(3)}</td>
        <td>×${a.occurrence_count}</td>
        <td>${a.status === 'confirmed'
              ? '<span class="tag ok">已确认</span>'
              : '<span class="tag warn">未确认</span>'}</td>
        <td>${a.status === 'confirmed' ? '-' :
              `<button data-id="${a.id}" class="confirm">确认</button>`}</td>
      </tr>`).join('');
    box.innerHTML = `<table>
      <thead><tr><th>ID</th><th>帧</th><th>分数</th><th>次数</th><th>状态</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table>`;
    box.querySelectorAll('button.confirm').forEach(b => {
      b.onclick = async () => {
        try { await api(`/alerts/${b.dataset.id}/confirm`, { method: 'POST' });
              log('已确认告警 #' + b.dataset.id); await refreshAlerts(); }
        catch (e) { log('确认失败：' + e.message); }
      };
    });
  } catch (e) { log('拉取告警失败：' + e.message); }
}

// ---------------------------------------------------------------- 启动
(async function boot() {
  setWho();
  if (S.token) {
    try { S.user = await api('/auth/me'); setWho(); await refreshMediaList(); await refreshAlerts(); }
    catch { S.token = ''; localStorage.removeItem('token'); setWho(); }
  } else {
    clearStage('请先登录。');
  }
})();
</script>
