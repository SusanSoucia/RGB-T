# ============================================================
# 反无人机检测与预警系统 —— 本地开发编排
# 详细用法见 docs/docker-dev.md
#
#   docker compose up -d              # 只起 db + api（日常开发）
#   docker compose --profile ml run --rm ml bash    # 进 GPU 训练容器
#   docker compose --profile web up -d              # 起前端（需先有 frontend/）
# ============================================================
name: uav-alert

services:
  # ---------------- PostgreSQL ----------------
  db:
    image: postgres:16-alpine
    container_name: uav-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uav_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-uav}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 用 pg_isready 而不是写死 sleep，api 才能可靠地等库起好
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uav} -d ${POSTGRES_DB:-uav}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # ---------------- 后端 API（FastAPI）----------------
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: dev
    image: uav-alert-api:dev
    container_name: uav-api
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 注意：容器内用服务名 db，不是 localhost
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-uav}:${POSTGRES_PASSWORD:-uav_dev_pw}@db:5432/${POSTGRES_DB:-uav}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      PYTHONPATH: /app
      # 开放自主注册（需求说明书 FR-01 那条"不开放注册"已确认是笔误）。
      # 想临时关掉（比如演示前锁定）就改成 "false"，注册接口会返回 REGISTER_DISABLED。
      ALLOW_SELF_REGISTER: ${ALLOW_SELF_REGISTER:-true}
      # ---- 检测模型 ----
      # stub = 假框（模型没训好时用）；ultralytics = 加载 ml/weights 下的真实权重
      DETECTOR_BACKEND: ${DETECTOR_BACKEND:-stub}
      # 每个任务最多处理多少帧（会均匀铺满整段视频，不是只处理开头）。
      # 取 100 是为了控制同步请求耗时（约 35 秒）；改异步后可上调。
      MAX_PROCESS_FRAMES: ${MAX_PROCESS_FRAMES:-100}
      IR_WEIGHTS: ${IR_WEIGHTS:-/app/ml/weights/ir_yolo11s_640.pt}
      # ⚠️ 可见光模型还没训，这里先指同一个热红外模型**占位**。
      #    这样单张上传（判定为 rgb 模式）也能跑真模型，不会回落成假框。
      #    训出 rgb 权重后改成 /app/ml/weights/rgb_yolo11s_640.pt。
      RGB_WEIGHTS: ${RGB_WEIGHTS:-/app/ml/weights/ir_yolo11s_640.pt}
      # 推理设备："0"=GPU；"cpu"=纯 CPU。半精度只有 GPU 能用。
      DETECT_DEVICE: ${DETECT_DEVICE:-0}
      DETECT_HALF: ${DETECT_HALF:-true}
      # Windows 上 bind mount 的文件变更事件常常不触发，
      # 打开轮询才能让 uvicorn --reload 真正生效（代价是一点 CPU）
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    # 把宿主机的 GPU 透传给容器（镜像里不需要 CUDA toolkit，驱动由宿主提供）
    # 容器里验一句：docker compose exec -T api nvidia-smi
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./backend:/app          # 代码热更新
      # 挂到 /app/ml 而不是 /opt/ml：这样 `python -m ml.datasets.xxx` 能直接跑，
      # PYTHONPATH=/app 就够，不用再多一个 sys.path 条目
      - ./ml:/app/ml:ro
      # MVP 单文件前端由后端直接托管（/ui），换成 Vue 后改为指向构建产物
      - ./frontend:/app/frontend:ro
      - ./data/uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 镜像里装了 curl；用 /health 探活，docker compose ps 才能看到 api 的 healthy
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

  # ---------------- 训练 / 推理（GPU，按需启动）----------------
  # 默认不启动（profiles: ml）。镜像较大（~7GB），且训练吃 I/O，
  # 日常调参建议在主机 venv 里跑，这个容器用于「复现」和「上服务器」。
  ml:
    profiles: ["ml"]
    build:
      context: .
      dockerfile: docker/ml.Dockerfile
    image: uav-alert-ml:dev
    container_name: uav-ml
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./ml:/workspace/ml
      - ./data:/data
      - ./runs:/workspace/runs
    working_dir: /workspace
    # PyTorch DataLoader 多 worker 必须给足共享内存，否则报
    #   RuntimeError: DataLoader worker (pid xxx) is killed by signal: Bus error
    shm_size: "8gb"
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["bash"]

  # ---------------- 独立前端 ----------------
  # frontend/app 是**无需构建**的静态站点（原生 JS），用一个极简静态
  # 服务器托管在容器内 5173，与后端不同源，所以后端开了 CORS。
  #
  # ⚠️ 宿主端口默认是 17880（不是 5173）：5173 会落进 Windows 的保留端口段，
  #    容器起不来（bind: ... forbidden by its access permissions）。
  #    容器内端口保持不变，只改宿主映射，这样 e2e 等容器内脚本都不用动。
  #
  # 之所以不用 Node/Vite：本机没装 npm，且拉 node_modules 要几百 MB，
  # 现阶段没必要。等前端组员决定上 Vue 时，再换回 docker/web.Dockerfile。
  web:
    profiles: ["web"]
    image: python:3.11-slim
    container_name: uav-web
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    working_dir: /site
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend/app:/site:ro
    command: ["python", "-m", "http.server", "5173", "--bind", "0.0.0.0", "--directory", "/site"]

volumes:
  pgdata:
